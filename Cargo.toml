# Workspace for the Jinn distribution.
#
# Native workspace members are the service-definition crates (pure types +
# logic, unit-tested on the host), a provider's pure transport codec, tools/
# (repo machinery: the pin gate, the seam kit builders), and tests/ (the
# real-composition gates). Guest plugin
# crates under plugins/ compile for wasm32-unknown-unknown ONLY and are
# deliberately NOT workspace members (the kernel's own demo-plugin pattern):
# a cdylib of the plugin world cannot link for the host target. The kit
# builder compiles them for wasm32 and encodes the components.

[workspace]
resolver = "2"
members = [
    "plugins/api/jinn-api",
    "plugins/api/jinn-api-http-wire",
    "plugins/cron/jinn-cron",
    "plugins/engines/jinn-engine",
    "plugins/engines/jinn-engine-codex-wire",
    "plugins/engines/jinn-engine-claude-wire",
    "plugins/sessions/jinn-session",
    "plugins/settings/jinn-settings",
    "tests/composition",
    "tools/api-kit",
    "tools/cron-kit",
    "tools/engine-kit",
    "tools/harness-pin",
    "tools/session-kit",
]

[workspace.package]
edition = "2021"
repository = "https://github.com/hristo2612/jinn-harness"
