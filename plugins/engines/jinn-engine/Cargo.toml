# The engines seam's SERVICE DEFINITION (AGENTS.md standing order 4): the
# `jinn:engine.<id>` contract's vocabulary and the run logic every
# provider shares — pure types + logic, no host calls, unit-tested here
# and compiled into the guests and the host tools alike. Providers add
# only what is theirs: the CLI's argv and its stream codec.
[package]
name = "jinn-engine"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license = "MIT"
publish = false

[dependencies]
# Secret references are the settings seam's fact, with one home there.
jinn-settings = { path = "../../settings/jinn-settings" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
