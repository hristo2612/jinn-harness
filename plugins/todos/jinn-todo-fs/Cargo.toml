# The todos seam's DURABLE store provider: one append-only JSONL journal
# per Todo over `jinn:fs`, and a replay on activate that reads back
# honestly what the last incarnation left behind. It opens no session: it
# injects the sessions seam's DEFINITION and drives whatever answers.
# Compiles for wasm32-unknown-unknown ONLY and is deliberately NOT a
# workspace member (see the workspace manifest's note).
[package]
name = "jinn-todo-fs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jinn-session = { path = "../../sessions/jinn-session" }
jinn-todo = { path = "../jinn-todo" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.43.0"

[workspace]
