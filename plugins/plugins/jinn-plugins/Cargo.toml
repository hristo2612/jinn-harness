# The plugins seam's SERVICE DEFINITION (AGENTS.md standing order 4): the
# `jinn:plugins.<catalog-id>` contract's vocabulary, the LIFECYCLE READING
# law and its explicit legal-transition table, the grant reading and where
# it came from, the ledger attribution rule, and the read window every
# answer carries — pure types + logic, no host calls, unit-tested here and
# compiled into the guests and the host tools alike. A provider adds only
# where the CATALOG comes from.
[package]
name = "jinn-plugins"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license = "MIT"
publish = false

[dependencies]
# The distribution's wire law has one home (`jinn_settings::wire`); this
# seam's closed surfaces refuse an unknown content the same way every
# other seam's do.
jinn-settings = { path = "../../settings/jinn-settings" }
# The extension tier's source digest has one home (`jinn_ext::source_digest`):
# the catalog's `attestation.source` is that digest, the same one the guest
# writes on the ledger as its breadcrumb (UI-2 §9.7 amendment 8(d)).
jinn-ext = { path = "../../ext/jinn-ext" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# The introspect mirror check (tests/introspect_mirror.rs): this crate's
# hand-mirrored `jinn:introspect` shapes against the vendored contract,
# PARSED. The pin gate owns the parser and the path to the vendored file.
harness-pin = { path = "../../../tools/harness-pin" }
