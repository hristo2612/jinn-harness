# The UI bundle seam's service definition: the `jinn:ui-bundle` contract as
# code — the manifest and bundle wire shapes, the bundle codec, the serving
# law as pure functions, and the MIME table. Compiled natively (unit tests,
# the kit) and into the wasm guests; it therefore depends on nothing but
# serde and sha2.
[package]
name = "jinn-ui"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license = "MIT"
publish = false

[dependencies]
# The sessions seam's `SessionSpec`, the payload of `jinn:ui/before-create-session`,
# from its one home (UI-2, moments).
jinn-session = { path = "../../sessions/jinn-session" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
