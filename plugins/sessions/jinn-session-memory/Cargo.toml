# The sessions seam's EPHEMERAL store provider: sessions live in this
# incarnation and nowhere else. Two jobs, and both are real — it is the
# genuine store for throwaway and test sessions (no disk, no cleanup, no
# grant beyond the engine it drives), and it is the SWAP proof: moving a
# profile entry's package from the fs store to this one changes where
# sessions live and nothing else. It spawns no engine: it injects the
# engines seam's DEFINITION and drives whatever answers.
# Compiles for wasm32-unknown-unknown ONLY and is deliberately NOT a
# workspace member (see the workspace manifest's note).
[package]
name = "jinn-session-memory"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jinn-engine = { path = "../../engines/jinn-engine" }
jinn-session = { path = "../jinn-session" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.43.0"

[workspace]
