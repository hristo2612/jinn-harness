# The sessions seam's DURABLE store provider: one append-only JSONL
# journal per session over `jinn:fs`, and a replay on activate that reads
# back honestly what the last incarnation left behind. It spawns no
# engine: it injects the engines seam's DEFINITION and drives whatever
# answers. Compiles for wasm32-unknown-unknown ONLY and is deliberately
# NOT a workspace member (see the workspace manifest's note).
[package]
name = "jinn-session-fs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jinn-engine = { path = "../../engines/jinn-engine" }
jinn-session = { path = "../jinn-session" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.43.0"

[workspace]
