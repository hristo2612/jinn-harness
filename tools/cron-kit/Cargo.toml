# The cron seam's kit builder (host machinery, like the demo builder in the
# kernel repo):
#   cron-kit kit <root> [--every-ms N] [--tick-ms N] — compile the two
#       guests for wasm32-unknown-unknown, encode components, write the
#       pinned profile. --every-ms sets the health job's period; --tick-ms
#       sets the scheduler's jinn:clock alarm period (default 60000).
[package]
name = "cron-kit"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license = "MIT"
publish = false

[dependencies]
jinn-cron = { path = "../../plugins/cron/jinn-cron" }
serde_json = "1.0"
sha2 = "0.10"
wit-component = "0.233.0"
