# The real-composition gate (AGENTS.md standing order 3): boots the cron
# profile and the operator-API profile through the REAL pinned jinnd
# daemon and proves each seam through the loader on REAL time — the scheduler's jinn:clock alarm firing jobs on
# schedule, reschedule on config edit, alarm re-request after a restart,
# dispose cancelling the alarm, and the AlarmWake / DispatchTrace ledger
# lines that record all of it. Self-skips LOUDLY when no jinnd checkout is
# reachable
# (the pin gate's Gate-2 discipline); Gate 1 equivalents (unit tests, pin)
# stay fail-closed everywhere.
[package]
name = "composition"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license = "MIT"
publish = false

[dependencies]
# The sessions seam's reason strings and vocabulary, asserted verbatim
# from their one home rather than spelled again in a test.
jinn-session = { path = "../../plugins/sessions/jinn-session" }
harness-pin = { path = "../../tools/harness-pin" }
jinn-api = { path = "../../plugins/api/jinn-api" }
jinn-cron = { path = "../../plugins/cron/jinn-cron" }
jinn-settings = { path = "../../plugins/settings/jinn-settings" }
# The ledger is the evidence surface (Law 2): tests read the daemon's
# append-only SQLite directly. Bundled so CI needs no system sqlite.
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
